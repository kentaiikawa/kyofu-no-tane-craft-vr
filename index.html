<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>恐怖の種 クラフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: the block world fills the screen; view chips along the top, a pixel-bordered card low-left, subtitles low-center */
:root{
  --sky:#0b1026; --panel:rgba(12,12,18,.88); --ink:#f1ead8; --muted:#aaa6b8; --red:#c8180c; --gold:#ffcf4a;
  --stone:#6f6f6f; --stone-hi:#a8a8a8; --stone-lo:#3c3c3c;
  --f:"DotGothic16","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#0b1026; --panel:rgba(12,12,18,.88); --ink:#f1ead8; } }
:root[data-theme="dark"]{ --sky:#0b1026; --panel:rgba(12,12,18,.88); --ink:#f1ead8; }
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center;color:var(--muted)}
.btn{appearance:none;font:15px/1 var(--f);color:#fff;background:var(--stone);border:3px solid #000;border-radius:0;
  box-shadow:inset -3px -4px 0 var(--stone-lo),inset 3px 3px 0 var(--stone-hi);padding:10px 16px 11px;cursor:pointer;text-shadow:2px 2px 0 #3a3a3a;letter-spacing:.04em}
.btn:hover{background:#7b84c4;box-shadow:inset -3px -4px 0 #45497a,inset 3px 3px 0 #b8bff0}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:#9a1b12;box-shadow:inset -3px -4px 0 #560d08,inset 3px 3px 0 #d0473b}
.btn.primary:hover{background:#b3241a}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.views{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.views .btn{font-size:13px;padding:7px 10px 8px}
.views .btn[aria-pressed="true"]{background:#3d6b2a;box-shadow:inset -3px -4px 0 #24401a,inset 3px 3px 0 #6fa152}
.card{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(25rem,calc(100% - 32px));box-sizing:border-box;z-index:5;
  background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 3px #4a4a55;padding:16px 18px}
.kicker{margin:0;font-size:12px;letter-spacing:.18em;color:var(--gold)}
h1{margin:6px 0 8px;font-weight:400;font-size:44px;line-height:1.1;letter-spacing:.06em;text-shadow:3px 3px 0 #000}
h1 span{color:var(--red)}
.lede{margin:0 0 12px;font-size:14px;line-height:1.8}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:10px 0 0;font-size:12px;line-height:1.7;color:var(--muted)}
.card.mini h1,.card.mini .lede,.card.mini .kicker,.card.mini .note{display:none}
.sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:4;width:min(44rem,calc(100% - 32px));margin:0;
  text-align:center;font-size:clamp(1rem,2.3vw,1.3rem);line-height:1.7;color:#fff;text-shadow:2px 2px 0 #000,0 0 6px #000;pointer-events:none;text-wrap:balance}
@media (max-width:560px){ h1{font-size:36px} .lede{font-size:13px} }
</style>
</head>
<body>
<div id="stage" aria-label="ブロックでできた夜のグリーンハウスと、その右手の外の廃棄場。廃棄場で物語「恐怖の種」がナレーションとともにブロックの世界で再現される3D空間"></div>

<nav class="views" id="views" aria-label="視点"></nav>
<p class="sub" id="sub" aria-live="polite"></p>

<section class="card" id="card">
  <p class="kicker">KUKULCAN 島唐辛子 · ブロック版</p>
  <h1>恐怖の<span>種</span></h1>
  <p class="lede">ブロックでできたハウスの右手の外、廃棄場で「物語を再生」を押すと、ナレーションで物語が流れます。聞きながら、まわりを自由に見て回れます。</p>
  <div class="actions">
    <button class="btn primary" id="storyBtn">▶ 物語を再生</button>
    <button class="btn" id="vrBtn">VRで見る</button>
  </div>
  <p class="note" id="vrNote" hidden></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stageEl=$('stage');
if(typeof THREE==='undefined'){ stageEl.innerHTML='<div class="fallback"><p>3D表示用のライブラリを読み込めませんでした。ページを再読み込みしてください。</p></div>'; return; }
let renderer; try{ renderer=new THREE.WebGLRenderer({antialias:true}); }catch(e){ stageEl.innerHTML='<div class="fallback"><p>このブラウザでは3D表示（WebGL）を利用できません。</p></div>'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.xr.enabled=true; renderer.xr.setReferenceSpaceType('local-floor');
stageEl.appendChild(renderer.domElement);
const FONT='"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif';
const V=(x,y,z)=>new THREE.Vector3(x,y,z), UP=V(0,1,0);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function strHash(s){ let h=2166136261; for(const c of s) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0; }
const rnd=mulberry32(7), R=(a,b)=>a+(b-a)*rnd();
const sm=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const pick=(r,a)=>a[(r()*a.length)|0];

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1026); scene.fog=new THREE.FogExp2(0x0d1328,0.022);
const camera=new THREE.PerspectiveCamera(68,1,0.05,300);
const dolly=new THREE.Group(); dolly.add(camera); scene.add(dolly);

/* ================= pixel textures (16px, nearest filtering) ================= */
const TX={}, TOPT={};
function T(name,draw,opt,w,h){ w=w||16; h=h||16; const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  draw(g,w,h,mulberry32(strHash(name))); const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestMipmapLinearFilter;
  TX[name]=t; TOPT[name]=opt||{}; return t; }
function speckle(g,w,h,r,cols){ for(let y=0;y<h;y++) for(let x=0;x<w;x++){ g.fillStyle=pick(r,cols); g.fillRect(x,y,1,1); } }
function px(g,col,pts){ g.fillStyle=col; pts.forEach(([x,y])=>g.fillRect(x,y,1,1)); }
const DIRT=['#6b4a2f','#7a5636','#5c3f27','#86603d','#4f3622'];
const GRASS=['#3f6a25','#4a7a2c','#365e20','#548634','#2f5520'];
T('grassTop',(g,w,h,r)=>speckle(g,w,h,r,GRASS));
T('dirt',(g,w,h,r)=>speckle(g,w,h,r,DIRT));
T('grassSide',(g,w,h,r)=>{ speckle(g,w,h,r,DIRT); for(let x=0;x<w;x++){ const d=2+((r()*3)|0); for(let y=0;y<d;y++) px(g,pick(r,GRASS),[[x,y]]); } });
T('farmland',(g,w,h,r)=>{ speckle(g,w,h,r,['#4a3220','#3f2a1b','#553a25','#45301e']); for(let y=3;y<h;y+=4) for(let x=0;x<w;x++) if(r()<.8) px(g,'#2b1d12',[[x,y]]); });
T('coarse',(g,w,h,r)=>speckle(g,w,h,r,[...DIRT,'#5a5650','#6a655c','#3e3a34']));
T('gravel',(g,w,h,r)=>speckle(g,w,h,r,['#7d7774','#6a6461','#8e8884','#55504d','#9a948f']));
T('glass',(g,w,h,r)=>{ g.clearRect(0,0,w,h); g.fillStyle='rgba(170,210,235,.10)'; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(225,242,255,.9)'; g.fillRect(0,0,w,1); g.fillRect(0,h-1,w,1); g.fillRect(0,0,1,h); g.fillRect(w-1,0,1,h);
  g.fillStyle='rgba(255,255,255,.55)'; [[3,4],[4,3],[4,5],[5,4],[5,6],[6,5],[11,10],[10,11],[12,11],[11,12]].forEach(([x,y])=>g.fillRect(x,y,1,1)); },{transparent:true});
T('quartzSide',(g,w,h,r)=>{ speckle(g,w,h,r,['#ece6dc','#e2dbcf','#f4efe6']); g.fillStyle='#c9bfae'; g.fillRect(0,0,1,h); g.fillRect(w-1,0,1,h); g.fillRect(4,0,1,h); g.fillRect(11,0,1,h); });
T('quartzTop',(g,w,h,r)=>{ speckle(g,w,h,r,['#ece6dc','#e2dbcf','#f4efe6']); g.strokeStyle='#c9bfae'; g.lineWidth=1; g.strokeRect(2.5,2.5,11,11); });
function planks(g,w,h,r,base,seam){ for(let y=0;y<h;y++) for(let x=0;x<w;x++){ g.fillStyle=pick(r,base); g.fillRect(x,y,1,1); }
  g.fillStyle=seam; for(let y=3;y<h;y+=4){ g.fillRect(0,y,w,1); const sx=(r()*w)|0; g.fillRect(sx,y-3,1,3); } }
T('oakPlanks',(g,w,h,r)=>planks(g,w,h,r,['#a27a4a','#9a7244','#ac8250','#94703f'],'#6e5130'));
T('darkPlanks',(g,w,h,r)=>planks(g,w,h,r,['#4a3320','#422d1c','#523822','#3d2a1a'],'#24180e'));
T('darkLogSide',(g,w,h,r)=>{ for(let x=0;x<w;x++){ const c=pick(r,['#3a2a1a','#2f2215','#45321f']); for(let y=0;y<h;y++){ g.fillStyle=r()<.2?'#24180e':c; g.fillRect(x,y,1,1); } } });
T('darkLogTop',(g,w,h,r)=>{ g.fillStyle='#3a2a1a'; g.fillRect(0,0,w,h); g.fillStyle='#6b5236'; g.fillRect(2,2,12,12); g.fillStyle='#5a4329'; g.fillRect(4,4,8,8); g.fillStyle='#6b5236'; g.fillRect(6,6,4,4); });
T('oakLogSide',(g,w,h,r)=>{ for(let x=0;x<w;x++){ const c=pick(r,['#6a5132','#5c452a','#76593a']); for(let y=0;y<h;y++){ g.fillStyle=r()<.18?'#3e2f1c':c; g.fillRect(x,y,1,1); } } });
T('oakLogTop',(g,w,h,r)=>{ g.fillStyle='#6a5132'; g.fillRect(0,0,w,h); g.fillStyle='#b8925c'; g.fillRect(2,2,12,12); g.fillStyle='#a07c4a'; g.fillRect(4,4,8,8); g.fillStyle='#b8925c'; g.fillRect(6,6,4,4); });
function cobble(g,w,h,r,extra){ speckle(g,w,h,r,['#7a7a7a','#8a8a8a','#6a6a6a','#808080']); for(let i=0;i<26;i++) px(g,'#424242',[[(r()*w)|0,(r()*h)|0]]); if(extra) for(let i=0;i<70;i++) px(g,pick(r,extra),[[(r()*w)|0,(r()*h)|0]]); }
T('cobble',(g,w,h,r)=>cobble(g,w,h,r));
T('mossy',(g,w,h,r)=>cobble(g,w,h,r,['#4f6b34','#5d7a3c','#3e5a2a']));
T('roof',(g,w,h,r)=>{ speckle(g,w,h,r,['#3b3b44','#34343c','#2d2d34','#40404a']); g.fillStyle='#1c1c22'; for(let y=3;y<h;y+=4){ g.fillRect(0,y,w,1); for(let x=(y%8===3?2:6);x<w;x+=8) g.fillRect(x,y-3,1,3); } });
T('windowLit',(g,w,h,r)=>{ speckle(g,w,h,r,['#ffb54a','#ffc970','#f29a30','#ffbf5c']); g.fillStyle='#2a1c10'; g.fillRect(0,0,w,2); g.fillRect(0,h-2,w,2); g.fillRect(0,0,2,h); g.fillRect(w-2,0,2,h); g.fillRect(7,0,2,h); g.fillRect(0,7,w,2);
  px(g,'#3a1a0a',[[4,4],[5,5],[11,11],[12,12],[3,12],[12,4]]); },{emissive:'windowLit'});
const PUMP=['#d97a1c','#c96a14','#e8862a'];
function pumpkinSide(g,w,h,r){ for(let x=0;x<w;x++){ const c=(x%4===0)?'#a8540e':pick(r,PUMP); for(let y=0;y<h;y++){ g.fillStyle=r()<.12?'#b8600f':c; g.fillRect(x,y,1,1); } } }
T('pumpkinSide',pumpkinSide);
T('pumpkinTop',(g,w,h,r)=>{ pumpkinSide(g,w,h,r); g.fillStyle='#5a4020'; g.fillRect(7,7,2,2); });
const FACE=[[3,5],[4,5],[5,5],[3,6],[4,6],[10,5],[11,5],[12,5],[11,6],[12,6],[3,10],[4,10],[5,10],[6,10],[7,10],[8,10],[9,10],[10,10],[11,10],[12,10],[4,11],[5,11],[7,11],[8,11],[10,11],[11,11],[5,12],[6,12],[9,12],[10,12]];
T('jackFace',(g,w,h,r)=>{ pumpkinSide(g,w,h,r); FACE.forEach(([x,y])=>px(g,r()<.5?'#ffe070':'#ffc030',[[x,y]])); },{emissive:'jackGlow'});
T('jackGlow',(g,w,h)=>{ g.fillStyle='#000'; g.fillRect(0,0,w,h); FACE.forEach(([x,y])=>px(g,'#ffd050',[[x,y]])); });
T('leaves',(g,w,h,r)=>{ g.clearRect(0,0,w,h); for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(r()<.22) continue; g.fillStyle=pick(r,['#2f5a22','#3a6a2a','#24481a','#2a5020']); g.fillRect(x,y,1,1); } },{cutout:true});
T('compost',(g,w,h,r)=>speckle(g,w,h,r,['#3a2a1a','#4a3a1e','#2e2414','#4a4a22','#5a3a20','#2a3218']));
T('crate',(g,w,h,r)=>{ planks(g,w,h,r,['#6a5132','#5e472c','#735737'],'#2e2214'); g.fillStyle='#3a2a18'; g.fillRect(0,0,w,1); g.fillRect(0,h-1,w,1); g.fillRect(0,0,1,h); g.fillRect(w-1,0,1,h); });
T('tint',(g,w,h,r)=>{ for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v=200+((r()*55)|0); g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(x,y,1,1); } },{},8,8);
T('chiliLeaf',(g,w,h,r)=>speckle(g,w,h,r,['#2e6a24','#3a7a2c','#255a1c','#448a34']),{},8,8);
T('planterSide',(g,w,h,r)=>{ planks(g,w,h,r,['#8a6a40','#7e603a','#946f42'],'#5a4226'); },{},16,8);
T('straw',(g,w,h,r)=>speckle(g,w,h,r,['#d8b860','#c8a650','#e6c874','#b8964a']),{},8,8);
T('lantern',(g,w,h,r)=>{ g.fillStyle='#2a2a30'; g.fillRect(0,0,w,h); g.fillStyle='#ffcf5a'; g.fillRect(3,3,10,10); px(g,'#fff1a8',[[6,6],[7,6],[8,7],[7,8],[6,9]]); g.fillStyle='#2a2a30'; g.fillRect(7,3,2,10); },{emissive:'lantern'});
T('stone',(g,w,h,r)=>speckle(g,w,h,r,['#7e7e7e','#757575','#888888','#6e6e6e']));
T('moon',(g,w,h,r)=>{ g.clearRect(0,0,w,h); speckle(g,w,h,r,['#efeadb','#e4dfcd','#f6f2e6']); px(g,'#cfc8b4',[[4,4],[5,4],[4,5],[10,9],[11,9],[11,10],[6,11],[3,10]]); });
T('cobweb',(g,w,h,r)=>{ g.clearRect(0,0,w,h); g.fillStyle='rgba(235,235,240,.85)'; for(let i=0;i<16;i++){ g.fillRect(i,i,1,1); g.fillRect(15-i,i,1,1); g.fillRect(7,i,1,1); g.fillRect(i,7,1,1); }
  [[3,7],[7,3],[11,7],[7,11],[4,4],[11,4],[4,11],[11,11]].forEach(([x,y])=>{ g.fillRect(x-1,y,3,1); g.fillRect(x,y-1,1,3); }); },{cutout:true});
// the double door of the haunted house (32x32 for a 2x2 block opening)
T('door',(g,w,h,r)=>{ planks(g,w,h,r,['#4a3320','#422d1c','#523822'],'#24180e'); g.fillStyle='#1e140a'; g.fillRect(0,0,w,2); g.fillRect(0,0,2,h); g.fillRect(w-2,0,2,h); g.fillRect(15,0,2,h); g.fillRect(0,h-2,w,2);
  [[4,4],[20,4]].forEach(([x,y])=>{ g.fillStyle='#0c0806'; g.fillRect(x,y,8,6); g.fillStyle='#ff9a3a'; g.fillRect(x+1,y+1,2,2); }); px(g,'#c8a040',[[13,17],[13,18],[18,17],[18,18]]); },{},32,32);
// the plain head and body pieces of the farmer
const SKIN=['#c8946c','#c08a64','#d09c74'], HAIR=['#3a2a1a','#32241a','#45321f'];
T('headSide',(g,w,h,r)=>{ speckle(g,w,h,r,SKIN); for(let y=0;y<5;y++) for(let x=0;x<w;x++) px(g,pick(r,HAIR),[[x,y]]); px(g,pick(r,HAIR),[[0,5],[1,5],[14,5],[15,5],[0,6],[15,6]]); },{},16,16);
T('headBack',(g,w,h,r)=>{ speckle(g,w,h,r,SKIN); for(let y=0;y<11;y++) for(let x=0;x<w;x++) px(g,pick(r,HAIR),[[x,y]]); });
T('headTop',(g,w,h,r)=>speckle(g,w,h,r,HAIR));
T('face',(g,w,h,r)=>{ speckle(g,w,h,r,SKIN); for(let y=0;y<4;y++) for(let x=0;x<w;x++) px(g,pick(r,HAIR),[[x,y]]);
  px(g,'#f4f0ea',[[3,8],[4,8],[11,8],[12,8]]); px(g,'#3a5a9a',[[4,8],[11,8]]); px(g,'#3a2a1a',[[3,7],[4,7],[11,7],[12,7]]);
  px(g,'#a8704c',[[7,10],[8,10]]); px(g,'#7a4a34',[[6,12],[7,12],[8,12],[9,12]]); });
T('zface',(g,w,h,r)=>{ speckle(g,w,h,r,SKIN); for(let y=0;y<4;y++) for(let x=0;x<w;x++) px(g,pick(r,HAIR),[[x,y]]);
  px(g,'#120808',[[3,7],[4,7],[3,8],[4,8],[11,7],[12,7],[11,8],[12,8],[5,8],[10,8]]); px(g,'#ff2a10',[[4,8],[11,8]]);
  px(g,'#3a1010',[[5,12],[6,12],[7,12],[8,12],[9,12],[10,12],[6,13],[7,13],[8,13],[9,13]]); px(g,'#e8e0c8',[[6,12],[9,12]]); });
T('shirt',(g,w,h,r)=>speckle(g,w,h,r,['#8a7a5a','#94845f','#7e6f52']),{},8,8);
T('overall',(g,w,h,r)=>{ speckle(g,w,h,r,['#8a7a5a','#94845f','#7e6f52']); for(let y=6;y<h;y++) for(let x=2;x<w-2;x++) px(g,pick(r,['#34465a','#2e3e50','#3a4e64']),[[x,y]]);
  for(let y=0;y<6;y++){ px(g,'#34465a',[[3,y],[12,y]]); } px(g,'#c8a040',[[3,6],[12,6]]); },{},16,16);
T('jeans',(g,w,h,r)=>{ speckle(g,w,h,r,['#34465a','#2e3e50','#3a4e64']); for(let y=13;y<h;y++) for(let x=0;x<w;x++) px(g,pick(r,['#2a1a10','#3a2414']),[[x,y]]); },{},8,16);
T('skin',(g,w,h,r)=>speckle(g,w,h,r,SKIN),{},8,8);
T('fruit',(g,w,h,r)=>{ speckle(g,w,h,r,['#d3190c','#c0140a','#e0261a']); px(g,'#ff8a70',[[1,1],[2,1],[1,2]]); px(g,'#8a0a06',[[6,6],[5,7],[6,7]]); },{},8,8);

const MAT={};
function matFor(name){
  if(MAT[name]) return MAT[name];
  const o=TOPT[name]||{};
  const m=new THREE.MeshLambertMaterial({map:TX[name]});
  if(o.transparent){ m.transparent=true; m.depthWrite=false; }
  if(o.cutout){ m.alphaTest=0.5; m.side=THREE.DoubleSide; }

  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

  const lfo=ac.createOscillator(); lfo.frequency.value=0.09; const lg=ac.createGain(); lg.gain.value=220; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  [43.6,46.2].forEach(f=>{ const o=ac.createOscillator(); o.frequency.value=f; const g=ac.createGain(); g.gain.value=0.05; o.connect(g); g.connect(master); o.start(); });
  const s=noise(), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=1.5; slither=ac.createGain(); slither.gain.value=0; s.connect(bp); bp.connect(slither); slither.connect(master); s.start();
}

  [S[7]+0.2,()=>sfx.boom(.6)],[S[8]-0.3,()=>sfx.sting()]
];

/* ---------- the timeline ---------- */
const tmp=V(0,0,0);
let lastT=-1;
function updateScene(T,t){
  if(T<lastT-0.5) lastT=-1;
  EVENTS.forEach(([at,fn])=>{ if(lastT<at && T>=at) fn(); }); lastT=T;
  titleP.material.opacity=sm(S[0]-1.5,S[0]+0.5,T)*(1-sm(S[1]-0.5,S[1]+1.5,T));
  const g=sm(S[2]+0.3,S[2]+6.5,T);
  setReveal(stem,g); setReveal(leaves,g);
  const sway=Math.sin(t*0.8)*0.02;
  const fk=sm(S[3]+0.2,S[3]+3.2,T), pulse=0.75+0.25*Math.sin(t*3.2);
  fruits.forEach(o=>{ const k=sm(o.t0,o.t0+0.6,fk*1.6); o.f.scale.setScalar(Math.max(0.001,k*1.5)); o.f.rotation.z=sway; o.glow.material.opacity=k*0.55*pulse; });
  fruitM.emissive.setRGB(0.35*pulse*fk+0.1,0,0);
  fruitLight.intensity=fk*1.6*pulse;
  const s4=S[4], s5=S[5];
  man.visible = T>s4-0.5 && T<s5+9.8;
  if(man.visible){
    const wk=sm(s4,s4+4.5,T), p=walkCurve.getPointAt(Math.min(1,wk)); man.position.copy(p);
    const tg=walkCurve.getTangentAt(Math.min(.999,wk)); let facing=Math.atan2(tg.x,tg.z);
    const walking=T<s4+4.5, ph=T*7;
    legL.rotation.x=walking?Math.sin(ph)*0.5:0; legR.rotation.x=walking?-Math.sin(ph)*0.5:0;
    armL.rotation.set(walking?-Math.sin(ph)*0.4:0,0,0.05); armR.rotation.set(walking?Math.sin(ph)*0.4:0,0,-0.05);
    upper.rotation.set(0,0,0); headG.rotation.set(0,0,0);
    if(!walking) facing=Math.atan2(PLANT.x-man.position.x,PLANT.z-man.position.z);
    const reach=sm(s4+4.6,s4+5.6,T), toMouth=sm(s4+5.7,s4+6.5,T);
    if(T>s4+4.5 && T<s5){ armR.rotation.x=-reach*1.5+toMouth*-0.6; armR.rotation.z=-0.05-toMouth*0.6; headG.rotation.x=toMouth*-0.2+(T>s4+6.6?Math.sin(t*14)*0.06:0); }
    const victim=fruits[2];
    if(T>s4+5.5 && T<s4+7){ victim.f.visible=false; bitten.visible=true; armR.updateMatrixWorld(true); bitten.position.copy(D.worldToLocal(armR.localToWorld(tmp.set(0,-0.74,0.06)))); }
    else bitten.visible=false;
    if(T<s4+5.5) victim.f.visible=true;
    const tr=sm(s5,s5+5,T);
    if(T>s5){
      const sh=reduceMotion?0:Math.sin(t*40)*0.05*tr*(T<s5+7?1:0.3);
      upper.rotation.x=0.55*tr+sh; headG.rotation.z=Math.sin(t*9)*0.25*tr; headG.rotation.x=-0.4*tr;
      armL.rotation.set(-1.4*tr,0,0.3*tr+sh); armR.rotation.set(-1.4*tr,0,-0.3*tr-sh);   // arms out in front, the blocky way
      headMats.forEach(m=>m.color.setRGB(1-0.45*tr,1-0.1*tr,1-0.5*tr)); handM.color.copy(headMats[0].color);
      if(faceMat.map!==(tr>0.4?zTex:fTex)){ faceMat.map=tr>0.4?zTex:fTex; faceMat.needsUpdate=true; }
      eyes.forEach(e=>e.material.opacity=tr);
      hat.visible=tr<0.6;
      if(T>s5+6) facing=Math.atan2(-man.position.x,-man.position.z);
      const rush=sm(s5+8.0,s5+9.6,T);
      if(rush>0){ man.position.lerpVectors(manPath[3],V(0,0,-0.45),rush); const rp=T*14; legL.rotation.x=Math.sin(rp)*0.8; legR.rotation.x=-Math.sin(rp)*0.8; }
    } else { headMats.forEach(m=>m.color.setRGB(1,1,1)); handM.color.setRGB(1,1,1); if(faceMat.map!==fTex){ faceMat.map=fTex; faceMat.needsUpdate=true; } eyes.forEach(e=>e.material.opacity=0); hat.visible=true; }
    man.rotation.y=facing;
  }
  const fl=T>S[5]+9.6 ? Math.max(0,1-(T-(S[5]+9.6))/1.4) : 0; flash.material.opacity=fl*0.85;
  const sp=sm(S[7]-0.5,S[7]+9,T);
  setReveal(vineMesh,sp); setReveal(berryMesh,sp);
  veins.material.opacity=sp*0.9;
  if(slither) slither.gain.value=0.12*sm(S[7]-0.5,S[7]+1,T)*(1-sm(S[8]+4,S[8]+8,T));
  scene.fog.density=0.022+0.03*sp;
  core.visible=T>S[6]+2; const ck=sm(S[7]+2,S[8]+1,T), cp=0.6+0.4*Math.sin(t*4.5);
  core.scale.set(1+0.08*cp*ck,1+0.1*cp*ck,1+0.08*cp*ck); coreM.emissive.setRGB(0.25+0.6*cp*ck,0,0);
  ringM.opacity=sm(S[8],S[8]+1.5,T)*(0.5+0.5*Math.sin(t*5)); coreRing.scale.setScalar(1+0.15*Math.sin(t*5));
  missionP.material.opacity=sm(S[8]-0.2,S[8]+1.2,T);
  let cur=''; S.forEach((st,i)=>{ if(T>=st-0.1 && T<st+CUE.durs[i]+0.9) cur=LINES[i]; });
  if(renderer.xr.isPresenting){ setVRSub(cur); if($('sub').textContent) $('sub').textContent=''; } else if($('sub').textContent!==cur) $('sub').textContent=cur;
  endP.material.opacity=sm(CUE.total-3,CUE.total-1.5,T);
}

/* ---------- narration and the story clock ---------- */
const narr=new Audio(window.__NARRATION||'narration.mp3'); narr.preload='auto';
let playing=false, ended=false, t0=0, audioOK=false;
narr.addEventListener('ended',()=>{ playing=false; ended=true; onState(); });
// the story keeps its own clock; while the narration is actually playing, it follows the narration
function start(){ audioInit(); narr.currentTime=0; lastT=-1; playing=true; ended=false; audioOK=false; t0=performance.now();
  const p=narr.play(); if(p && p.then) p.then(()=>{ audioOK=true; }).catch(()=>{ audioOK=false; }); onState(); }
function stop(){ playing=false; ended=false; narr.pause(); onState(); }
function nowT(){
  if(window.__forceT!=null) return window.__forceT;   // used by the screenshot tests
  if(!playing) return ended ? CUE.total : 0;
  const T=(audioOK && !narr.paused) ? narr.currentTime : (performance.now()-t0)/1000;
  if(T>=CUE.total){ playing=false; ended=true; onState(); return CUE.total; }
  return T;
}
let onState=()=>{};
const rc=new THREE.Raycaster(); let hover=false;
function rayHit(o,d){ rc.set(o,d); rc.far=8; return rc.intersectObject(button,false).length>0 || rc.intersectObject(btnLabel,false).length>0; }
function unlock(){ if(playing) return; const p=narr.play(); if(p && p.then) p.then(()=>{ if(!playing){ narr.pause(); narr.currentTime=0; } }).catch(()=>{}); }
return {
  start, stop, rayHit, unlock,
  setHover(h){ hover=h; },
  set onState(f){ onState=f; },
  get playing(){ return playing; },
  update(t){
    updateScene(nowT(),t);
    drawLabel(playing ? '■ 再生中…' : (ended ? '▶ もう一度聞く' : '▶ 物語を聞く'));
    btnM.emissive.setRGB(hover?0.6:0.25+0.12*Math.sin(t*3),0,0);
    helpP.material.opacity=renderer.xr.isPresenting && !playing ? 1 : 0;
    subP.visible=renderer.xr.isPresenting;
  }
};
})();

/* ================= walls you cannot pass through (floor plan boxes [x0,z0,x1,z1]) ================= */
const SOLID=[
  [GX0,GZ0,GX0+1,GZ1+1],[GX1,GZ0,GX1+1,GZ1+1],[GX0,GZ0,GX1+1,GZ0+1],      // greenhouse sides and back
  [GX0,GZ1,-2,GZ1+1],[1,GZ1,GX1+1,GZ1+1],                                  // greenhouse front, door open (x -2..1)
  [HX0,HZ0,HX1+1,HZ1+1],                                                   // haunted house (closed)
  [-4,-8,-3,5],[-2,-8,-1,5],                                               // chili planters
  [-3,GZ1+1,-2,GZ1+2],[1,GZ1+1,2,GZ1+2],[-4,GZ1+1,-3,GZ1+2],[0,HZ1+1,1,HZ1+2],[3,HZ1+1,4,HZ1+2]   // pumpkins
];
const BODY_R=0.15;
function pushOut(x,z,r){
  for(let it=0;it<3;it++) for(const [x0,z0,x1,z1] of SOLID){
    const cx=Math.max(x0,Math.min(x1,x)), cz=Math.max(z0,Math.min(z1,z)); let ex=x-cx, ez=z-cz, d=Math.hypot(ex,ez);
    if(d>=r) continue;
    if(d<1e-6){ const opts=[[x-x0,-1,0],[x1-x,1,0],[z-z0,0,-1],[z1-z,0,1]].sort((a,b)=>a[0]-b[0])[0]; x+=opts[1]*(opts[0]+r); z+=opts[2]*(opts[0]+r); }
    else { x=cx+ex/d*r; z=cz+ez/d*r; }
  }
  return [x,z];
}
function segHitsBox(ax,az,bx,bz,[x0,z0,x1,z1]){ let t0=0,t1=1; const dx=bx-ax, dz=bz-az;
  for(const [p,q] of [[-dx,ax-x0],[dx,x1-ax],[-dz,az-z0],[dz,z1-az]]){ if(Math.abs(p)<1e-9){ if(q<0) return false; } else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } } }
  return true; }
function canReach(x0,z0,x1,z1){ if(SOLID.some(b=>segHitsBox(x0,z0,x1,z1,b))) return false; const [px,pz]=pushOut(x1,z1,BODY_R); return Math.hypot(px-x1,pz-z1)<0.01; }

/* ================= desktop views ================= */
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=0.3; controls.maxDistance=70;
const VIEWS=[
  {name:'全体',cam:[-15,13,24],target:[2.5,1,1]},
  {name:'入口',cam:[-0.5,1.7,16.5],target:[-0.5,1.6,6]},
  {name:'ハウスの中',cam:[-2.5,1.7,8.6],target:[-2.5,1.2,-6]},
  {name:'お化け屋敷',cam:[-0.6,1.7,9.2],target:[2,1.5,6]},
  {name:'廃棄場',cam:[7.5,1.7,2.5],target:[10.9,1.0,2.5]}
];
const viewBtns=VIEWS.map((v,i)=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=v.name; b.setAttribute('aria-pressed','false'); b.addEventListener('click',()=>go(i)); $('views').appendChild(b); return b; });
let fly=null;
function go(i,instant){ const v=VIEWS[i]; viewBtns.forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));
  if(instant){ camera.position.set(...v.cam); controls.target.set(...v.target); fly=null; return; }
  fly={t:0,c0:camera.position.clone(),t0:controls.target.clone(),c1:V(...v.cam),t1:V(...v.target)}; }
function flyUpdate(dt){ if(!fly) return; fly.t=Math.min(1,fly.t+dt/1.4); const k=sm(0,1,fly.t); camera.position.lerpVectors(fly.c0,fly.c1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=1) fly=null; }
go(0,true);
const storyBtn=$('storyBtn'), card=$('card');
story.onState=()=>{ storyBtn.textContent=story.playing?'■ 止める':'▶ 物語を再生'; card.classList.toggle('mini',story.playing); };
storyBtn.addEventListener('click',()=>{ if(story.playing){ story.stop(); return; } go(4); story.start(); });

/* ================= VR (WebXR) ================= */
const rayGeo=new THREE.BufferGeometry().setFromPoints([V(0,0,0),V(0,0,-1)]);
const marker=new THREE.Mesh(new THREE.RingGeometry(0.16,0.22,4).rotateX(-Math.PI/2).rotateY(Math.PI/4),new THREE.MeshBasicMaterial({color:0x8fd3ff,depthTest:false,transparent:true,opacity:.9}));
marker.renderOrder=21; marker.visible=false; scene.add(marker);
let armSwinging=false, swingSpeed=0;
const ctrls=[0,1].map(k=>{
  const c=renderer.xr.getController(k);
  const ray=new THREE.Line(rayGeo,new THREE.LineBasicMaterial({color:0xf1ead8,transparent:true,opacity:.7})); ray.scale.z=4; c.add(ray);
  c.userData={ray,hit:null,src:null};
  c.addEventListener('connected',e=>{ c.userData.src=e.data; });
  c.addEventListener('disconnected',()=>{ c.userData.src=null; });
  c.addEventListener('selectstart',()=>{ c.userData.dragged=0; });
  c.addEventListener('select',()=>{ if(c.userData.btn){ story.playing?story.stop():story.start(); return; }
    if(c.userData.hit && c.userData.ok && (c.userData.dragged||0)<0.08 && !armSwinging) teleportTo(c.userData.hit.x,c.userData.hit.z); });
  dolly.add(c); return c;
});
const hands=[0,1].map(k=>{ const h=renderer.xr.getHand(k); dolly.add(h); return h; });
// blocky arms on the controllers
const armSkin=new THREE.MeshLambertMaterial({map:TX.skin}), sleeve=new THREE.MeshLambertMaterial({map:TX.shirt});
const grips=[0,1].map(k=>{
  const g=renderer.xr.getControllerGrip(k); dolly.add(g);
  g.addEventListener('connected',e=>{ if(e.data.hand || g.userData.arm) return; const a=new THREE.Group(); a.rotation.x=-0.35;
    boxMesh(.085,.085,.2,armSkin,0,0,.06,a); boxMesh(.1,.1,.14,sleeve,0,0,.22,a); g.add(a); g.userData.arm=a; g.userData.src=e.data; });
  g.addEventListener('disconnected',()=>{ if(g.userData.arm){ g.remove(g.userData.arm); g.userData.arm=null; } g.userData.src=null; });
  return g;
});
function updateArms(){ grips.forEach(g=>{ const a=g.userData.arm, src=g.userData.src; if(!a || !src || !src.gamepad) return; const b=src.gamepad.buttons, v=i=>b[i]?(b[i].value||0):0; a.scale.setScalar(1-0.12*Math.max(v(0),v(1))); }); }
const jointGeo=new THREE.BoxGeometry(0.016,0.016,0.016), jointMat=new THREE.MeshLambertMaterial({map:TX.skin});
function dressHand(h){ for(const name in h.joints){ const j=h.joints[name]; if(!j.userData.bead){ const b=new THREE.Mesh(jointGeo,jointMat); j.add(b); j.userData.bead=b; } } }
const loco=[{prev:null,active:false},{prev:null,active:false}];
const vLoc=V(0,0,0), vFw=V(0,0,0), vO=V(0,0,0), vD=V(0,0,0), vH=V(0,0,0), qH=new THREE.Quaternion();
function handInput(k){
  const h=hands[k], c=ctrls[k], src=c.userData.src;
  if(src && src.hand && h.joints && h.joints['wrist'] && h.joints['wrist'].visible){ dressHand(h); return {active:!!(h.inputState && h.inputState.pinching), pos:h.joints['wrist'].position}; }
  const gp=src && src.gamepad; return {active:!!(gp && gp.buttons[1] && gp.buttons[1].pressed), pos:c.position};
}
function headForward(){ camera.getWorldDirection(vFw); vFw.y=0; if(vFw.lengthSq()<1e-6) vFw.set(0,0,-1); return vFw.normalize(); }
function locomote(dt){
  const ins=[handInput(0),handInput(1)], both=ins[0].active && ins[1].active; armSwinging=both;
  if(both){ let vy=0; ins.forEach((s,k)=>{ const L=loco[k]; if(L.prev) vy+=Math.abs(s.pos.y-L.prev.y)/Math.max(dt,1e-3); });
    swingSpeed+=(Math.min(2.4,vy*0.7)-swingSpeed)*Math.min(1,dt*6); dolly.position.addScaledVector(headForward(),swingSpeed*dt); }
  else { swingSpeed=0; ins.forEach((s,k)=>{ const L=loco[k]; if(s.active && L.prev && L.active){ vLoc.copy(s.pos).sub(L.prev); vLoc.y=0; vLoc.applyQuaternion(dolly.quaternion); dolly.position.addScaledVector(vLoc,-1.6); ctrls[k].userData.dragged=(ctrls[k].userData.dragged||0)+vLoc.length(); } }); }
  ins.forEach((s,k)=>{ const L=loco[k]; L.active=s.active; L.prev=(L.prev||V(0,0,0)).copy(s.pos); });
}
function headWorld(){ camera.getWorldPosition(vH); return vH; }
function headYaw(){ camera.getWorldQuaternion(qH); const f=V(0,0,-1).applyQuaternion(qH); return Math.atan2(-f.x,-f.z); }
function teleportTo(x,z){ const h=headWorld(); dolly.position.x+=x-h.x; dolly.position.z+=z-h.z; }
function turnBy(a){ const h=headWorld().clone(); dolly.position.sub(h).applyAxisAngle(UP,a).add(h); dolly.rotation.y+=a; }
function keepOutOfWalls(){ const h=headWorld(); const [nx,nz]=pushOut(h.x,h.z,BODY_R); dolly.position.x+=nx-h.x; dolly.position.z+=nz-h.z; }
const START={p:[7.5,2.5],look:[10.9,2.5]};
let vrFrames=0, vrPending=false;
const vrBtn=$('vrBtn'), vrNote=$('vrNote');
function note(t){ vrNote.textContent=t; vrNote.hidden=false; }
if(!navigator.xr){ note('VRゴーグル（Meta Quest など）のブラウザでこのページを開くと、VRで見られます。'); vrBtn.setAttribute('aria-disabled','true'); }
else navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(!ok){ note('この端末ではVRを使えません。VRゴーグルのブラウザで開いてください。'); vrBtn.setAttribute('aria-disabled','true'); } }).catch(()=>{});
vrBtn.addEventListener('click',async()=>{
  if(!navigator.xr || vrBtn.getAttribute('aria-disabled')==='true') return;
  story.unlock();   // let the narration play later from a trigger press in VR
  if(renderer.xr.isPresenting){ renderer.xr.getSession().end(); return; }
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
    session.addEventListener('end',onVREnd);
    await renderer.xr.setSession(session);
    vrFrames=0; vrPending=true; card.hidden=true; $('views').hidden=true; $('sub').textContent='';
  }catch(e){ note('VRを開始できませんでした（'+(e.name||e.message)+'）。このページの表示枠ではVRが許可されていない可能性があります。'); }
});
function onVREnd(){ marker.visible=false; dolly.position.set(0,0,0); dolly.rotation.set(0,0,0); card.hidden=false; $('views').hidden=false; go(4,true); resize(); }
function vrUpdate(dt){
  vrFrames++;
  if(vrPending && vrFrames>3){ const dx=START.look[0]-START.p[0], dz=START.look[1]-START.p[1]; turnBy(Math.atan2(-dx,-dz)-headYaw()); teleportTo(...START.p); vrPending=false; }
  locomote(dt); updateArms();
  let shown=null, shownOk=true, anyBtn=false;
  ctrls.forEach(c=>{
    const u=c.userData; u.hit=null;
    c.getWorldPosition(vO); vD.set(0,0,-1).applyQuaternion(c.getWorldQuaternion(qH));
    u.btn=story.rayHit(vO,vD); if(u.btn) anyBtn=true;
    if(!u.btn && vD.y<-0.05){ const t=-vO.y/vD.y; if(t<25){ u.hit=vO.clone().addScaledVector(vD,t); u.ray.scale.z=t; } }
    if(!u.hit) u.ray.scale.z=u.btn?1.2:4;
    if(u.hit){ const h=headWorld(); u.ok=canReach(h.x,h.z,u.hit.x,u.hit.z); }
    if(u.hit && (!shown || (u.src && u.src.handedness==='right'))){ shown=u.hit; shownOk=u.ok; }
    const gp=u.src && u.src.gamepad; if(!gp) return;
    const ax=gp.axes[2]||0, ay=gp.axes[3]||0;
    if(u.src.handedness==='left'){ if(Math.hypot(ax,ay)>0.15){ const f=headForward(), rx=-f.z, rz=f.x; dolly.position.x+=(f.x*-ay+rx*ax)*1.6*dt; dolly.position.z+=(f.z*-ay+rz*ax)*1.6*dt; } }
    else { if(Math.abs(ax)>0.7 && !u.turned){ turnBy(ax>0?-Math.PI/6:Math.PI/6); u.turned=true; } if(Math.abs(ax)<0.3) u.turned=false; }
  });
  story.setHover(anyBtn);
  marker.visible=!!shown; if(shown){ marker.position.set(shown.x,0.03,shown.z); marker.material.color.set(shownOk?0x8fd3ff:0xff4030); }
  keepOutOfWalls();
}

/* ================= loop ================= */
function resize(){ const w=stageEl.clientWidth||innerWidth, h=stageEl.clientHeight||innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(renderer.xr.isPresenting) vrUpdate(dt); else { flyUpdate(dt); controls.update(); }
  lanterns.forEach(o=>{ if(o.l) o.l.intensity=o.base*(0.85+0.15*Math.sin(t*7+o.ph)*Math.sin(t*2.3+o.ph)); });
  clouds.forEach(c=>{ c.position.x+=dt*0.6; if(c.position.x>130) c.position.x=-130; });
  story.update(t);
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(tick);
window.__craft={go,story,camera,controls};
})();
</script>
